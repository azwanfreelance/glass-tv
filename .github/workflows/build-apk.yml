name: Build Glass TV APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Fetch checksum-pinned CC0 azan audio
        working-directory: .
        run: python3 tools/fetch-adhan.py
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build debug APK (does not connect to TV)
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify packaged minimum permissions
        working-directory: .
        run: python3 tools/check_apk_permissions.py launcher/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solat-tv-unit-test-reports
          path: launcher/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: solat-tv-debug-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
