name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Example lists, README tables, shell helpers
        env:
          CLEANYOURTV_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
        run: python3 -m unittest discover -s tests -v

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch checksum-pinned CC0 azan audio
        run: python3 tools/fetch-adhan.py
      - name: Unit tests and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Bound code and offline audio size
        run: |
          python3 - <<'PYCI'
          from zipfile import ZipFile
          from pathlib import Path
          apk = Path('launcher/app/build/outputs/apk/release/app-release.apk')
          with ZipFile(apk) as z:
              audio = sum(i.compress_size for i in z.infolist() if i.filename.endswith('/adhan.ogg'))
          code = apk.stat().st_size - audio
          print('Total APK:', apk.stat().st_size, 'non-audio:', code)
          assert audio > 0, 'Offline audio missing'
          assert code < 409600, 'Non-audio launcher exceeds original 400 KB budget'
          assert apk.stat().st_size < 2097152, 'Total release APK exceeds 2 MB'
          PYCI
